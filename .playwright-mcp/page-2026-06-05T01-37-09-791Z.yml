    - list [ref=e6]:
      - listitem [ref=e7]:
        - strong [ref=e8]: Solo Campaign
        - text: — Progress through procedurally generated levels with increasing enemy difficulty. Beat your personal best score across 60+ levels.
      - listitem [ref=e9]:
        - strong [ref=e10]: Arcade Wave Survival
        - text: — Fight waves of AI enemies powered by Q-learning machine learning. Each wave gets harder as enemies adapt to your tactics.
      - listitem [ref=e11]:
        - strong [ref=e12]: VS AI
        - text: — Best-of-9 match against a self-learning adaptive opponent that studies your playstyle across rounds.
      - listitem [ref=e13]:
        - strong [ref=e14]: Multiplayer
        - text: — Real-time online tank battles with friends via Firebase. Create or join lobbies with room codes.
