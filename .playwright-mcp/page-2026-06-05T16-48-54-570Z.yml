    - heading "Tank Battle Arena — Free 2D Tank Battle Game" [level=1] [ref=e3]
    - paragraph [ref=e4]: Tank Battle Arena is a fast-paced 2D top-down tank battle game inspired by Wii Play. Navigate maze-like arenas, eliminate enemy tanks, and compete across multiple game modes.
    - heading "Game Modes" [level=2] [ref=e5]
    - list [ref=e6]:
      - listitem [ref=e7]:
        - strong [ref=e8]: Solo Campaign
        - text: — Progress through procedurally generated levels with increasing enemy difficulty. Beat your personal best score across 60+ levels.
      - listitem [ref=e9]:
        - strong [ref=e10]: Arcade Wave Survival
        - text: — Fight waves of AI enemies powered by Q-learning machine learning. Each wave gets harder as enemies adapt to your tactics.
      - listitem [ref=e11]:
        - strong [ref=e12]: VS AI
        - text: — Best-of-9 match against a self-learning adaptive opponent that studies your playstyle across rounds.
      - listitem [ref=e13]:
        - strong [ref=e14]: Multiplayer
        - text: — Real-time online tank battles with friends via Firebase. Create or join lobbies with room codes.
    - heading "Features" [level=2] [ref=e15]
    - list [ref=e16]:
      - listitem [ref=e17]: 4 tiers of enemy AI with increasing difficulty
      - listitem [ref=e18]: "5 weapon types: standard, rapid-fire, cannon, shotgun, sniper"
      - listitem [ref=e19]: Deployable mines with 120px blast radius
      - listitem [ref=e20]: Procedurally generated maze arenas
      - listitem [ref=e21]: "Upgrade system: speed, fuel capacity, mine radius"
      - listitem [ref=e22]: Online leaderboard with Firebase integration
      - listitem [ref=e23]: Guest sign-in or email authentication
      - listitem [ref=e24]: Friend codes and invitation system
    - heading "Controls" [level=2] [ref=e25]
    - paragraph [ref=e26]: WASD to move, mouse to aim, left-click to fire, C to place mines, Escape to pause. Free browser game with no download required — works on desktop and mobile browsers.
